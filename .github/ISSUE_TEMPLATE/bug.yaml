name: Bug Report
description: File a bug report
title: "[BUG] "
labels: [bug]
body:
  - type: input
    id: summary
    attributes:
      label: Bug Summary
      description: Brief summary of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How to reproduce the issue
      placeholder: "1. Go to...\n2. Click on...\n3. See error"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
